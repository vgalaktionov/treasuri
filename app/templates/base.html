<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}Treasuri{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/pico.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script defer src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("{{ url_for('service_worker') }}");
      }
    </script>
  </head>
  <body>
    <header class="app-shell">
      <nav aria-label="Primary">
        <a class="brand" href="/" aria-label="💸 Treasuri">
          <span class="brand-mark" aria-hidden="true">💸</span>
          <span>Treasuri</span>
        </a>
        <ul class="desktop-nav">
          <li><a href="/">Today</a></li>
          <li><a href="/month">Month</a></li>
          <li><a href="/transactions">Transactions</a></li>
          <li><a href="/review">Review</a></li>
          <li><a href="/categories">Categories</a></li>
          <li><a href="/rules">Rules</a></li>
          <li><a href="/recurring">Recurring</a></li>
          <li><a href="/export">Export</a></li>
          <li><a href="/settings">Settings</a></li>
          <li><a href="/status">Status</a></li>
        </ul>
      </nav>
    </header>
    <main class="app-shell">
      {% block content %}{% endblock %}
    </main>
    <nav class="mobile-tabbar" aria-label="Primary mobile">
      <a href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7"></path>
          <path d="M5 10v10h14V10"></path>
          <path d="M9 20v-6h6v6"></path>
        </svg>
        <span>Today</span>
      </a>
      <a href="/month" {% if request.path == "/month" %}aria-current="page"{% endif %}>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M8 2v4"></path>
          <path d="M16 2v4"></path>
          <path d="M3 10h18"></path>
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        </svg>
        <span>Month</span>
      </a>
      <a href="/transactions" {% if request.path == "/transactions" %}aria-current="page"{% endif %}>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M8 6h13"></path>
          <path d="M8 12h13"></path>
          <path d="M8 18h13"></path>
          <path d="M3 6h.01"></path>
          <path d="M3 12h.01"></path>
          <path d="M3 18h.01"></path>
        </svg>
        <span>Txns</span>
      </a>
      <a href="/review" {% if request.path == "/review" %}aria-current="page"{% endif %}>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
        <span>Review</span>
      </a>
      <a href="/more" {% if request.path in ["/more", "/categories", "/rules", "/recurring", "/export", "/settings", "/status"] %}aria-current="page"{% endif %}>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M5 12h.01"></path>
          <path d="M12 12h.01"></path>
          <path d="M19 12h.01"></path>
        </svg>
        <span>More</span>
      </a>
    </nav>
  </body>
</html>

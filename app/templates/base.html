<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}Treasuri{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/pico.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script defer src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}");
      }
    </script>
  </head>
  <body>
    <header class="app-shell">
      <nav aria-label="Primary">
        <a class="brand" href="/">Treasuri</a>
        <ul>
          <li><a href="/">Today</a></li>
          <li><a href="/transactions">Transactions</a></li>
          <li><a href="/review">Review</a></li>
          <li><a href="/export">Export</a></li>
          <li><a href="/settings">Settings</a></li>
          <li><a href="/status">Status</a></li>
        </ul>
      </nav>
    </header>
    <main class="app-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

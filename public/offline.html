<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Treasuri Offline</title>
    <style>
      body {
        margin: 0;
        min-width: 320px;
        background: #fbfbf8;
        color: #17211a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
      }

      section {
        max-width: 34rem;
      }

      p {
        color: #5a675f;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="offline-title">
        <p>Offline</p>
        <h1 id="offline-title">Treasuri cannot reach the server.</h1>
        <p>Reconnect to view your dashboard, transactions, exports, and settings.</p>
      </section>
    </main>
  </body>
</html>

[project]
name = "treasuri"
version = "0.1.0"
description = "Private personal-finance PWA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "abna>=0.3",
    "flask>=3.1.3",
    "flask-oidc>=2.4.0",
    "openpyxl>=3.1.5",
    "pgqueuer>=1.0.1",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "testcontainers[postgres]>=4.14.2",
    "ty>=0.0.40",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.12"
